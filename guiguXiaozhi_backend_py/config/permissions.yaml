# 工具权限策略（热加载：改完重启即生效，工具层代码不用动）
#
# 等级说明：
#   deny      —— 永远禁止调用
#   ask       —— 每次都要用户确认；没有交互通道时按 no_ui 策略处理（默认拒绝）
#   auto      —— 自动放行，但首次会要求确认，之后按"参数指纹"缓存授权
#   override  —— 管理员强制放行
#
# 硅谷小智的默认策略：
#   只读查询  → auto（首次确认后可复用）
#   写预约    → ask（写业务库，必须确认）
#   取消预约  → ask（破坏性操作，必须确认）

tools:
  查询是否有号源:
    level: auto
    description: 只读查询号源

  查询科室专家:
    level: auto
    description: 只读查询专家名单

  预约挂号:
    level: ask
    description: 写入预约记录

  取消预约挂号:
    level: ask
    description: 删除预约记录（破坏性）
