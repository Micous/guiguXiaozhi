# ==================== Web ====================
server.port=8080

# ==================== 本地大模型（Ollama） ====================
# 全部模型来自本机 Ollama，不依赖任何云端 API，无需配置 API Key
xiaozhi.ollama.base-url=http://localhost:11434
# 对话 / 流式对话模型（qwen2.5 支持 Function Calling，可驱动挂号工具）
xiaozhi.ollama.chat-model=qwen2.5:7b
# 向量化模型（1024 维）
xiaozhi.ollama.embedding-model=andersc/qwen3-embedding:0.6b
# 温度压到 0.1：本地小模型在高温下容易“用文字代替工具调用”，
# 低温度能让工具选择稳定可复现（实测同一请求 8/8 都正确触发“预约挂号”工具）
xiaozhi.ollama.temperature=0.1
# 本地推理较慢，超时时间放宽
xiaozhi.ollama.timeout-seconds=300
# 是否打印模型请求/响应日志（排查问题时可改为 true）
xiaozhi.ollama.log-requests=false

# ==================== 向量数据库（Milvus / Docker） ====================
# 本地 Docker 部署的 Milvus standalone，索引持久化，无需每次重启重新向量化
xiaozhi.milvus.host=localhost
xiaozhi.milvus.port=19530
xiaozhi.milvus.collection-name=xiaozhi_knowledge
# 相似度度量方式，与向量模型配合使用；COSINE 与之前的内存向量库一致，阈值可直接沿用
xiaozhi.milvus.metric-type=COSINE
xiaozhi.milvus.index-type=FLAT
# 集合为空时自动灌入知识库（已有数据则跳过，避免重复写入）
xiaozhi.milvus.auto-ingest=true

# ==================== RAG 知识库 ====================
# 检索返回的最大结果条数
xiaozhi.rag.max-results=2
# 检索命中的最低相似度分数。
# 实测（qwen3-embedding）：相关问题得分 0.80~0.84，无关问题（"写诗"/"天气"/"你好"）只有 0.66~0.78，
# 取 0.79 可以有效过滤掉无关内容，避免把不相干的知识片段塞进提示词（否则模型会被带偏）。
xiaozhi.rag.min-score=0.79
# 知识库文档位置（classpath 通配符，启动时自动切分并向量化写入 Milvus 索引）
xiaozhi.knowledge.location=classpath*:knowledge/*.md

# 专家名单所在的知识库文件名（向量库检索专家时按文件名过滤）。
# 注意：.properties 里的值按 Latin-1 读取，所以这里只能写 ASCII 文件名。
xiaozhi.knowledge.doctor-roster-file=doctors.md

# ==================== 日志 ====================
logging.level.root=info
logging.level.com.atguigu=debug
# 需要排查模型请求/响应时打开下面这行
#logging.level.dev.langchain4j=debug

# ==================== MongoDB 对话记忆 ====================
spring.data.mongodb.uri=mongodb://localhost:27017/chat_memory_db

# ==================== MySQL 业务库 ====================
spring.datasource.url=jdbc:mysql://localhost:3306/guiguxiaozhi?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# 打印 SQL
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
